services:
  - type: web
    name: safe-sight-guardian-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SAFE_SIGHT_PUBLIC_READ_ONLY
        value: "true"
